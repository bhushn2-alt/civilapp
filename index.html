<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>SiteBook · साईटबुक</title>
<link href="https://fonts.googleapis.com/css2?family=Mukta:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#e9e7e2;--card:#fbfaf7;--ink:#1b232b;--mut:#66707a;--pri:#1e4d8c;--onp:#fff;--acc:#f0a500;--ok:#2b7a4b;--bad:#b3362b;--line:#d6d3ca;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12171c;--card:#1c242c;--ink:#e9edf0;--mut:#8f9aa5;--pri:#6ea3e8;--onp:#10202f;--acc:#f0b429;--ok:#5cc489;--bad:#f07a6e;--line:#2c3742;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#12171c;--card:#1c242c;--ink:#e9edf0;--mut:#8f9aa5;--pri:#6ea3e8;--onp:#10202f;--acc:#f0b429;--ok:#5cc489;--bad:#f07a6e;--line:#2c3742;color-scheme:dark}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.4 Mukta,"Noto Sans Devanagari",system-ui,sans-serif}
#app{max-width:480px;margin:0 auto;padding:14px 14px 96px}
h1,h2{margin:0;font-weight:800}h2{font-size:22px;margin:6px 0 12px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}.top b{font-size:20px;font-weight:800}
.ib{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:6px 10px;font:600 14px Mukta,sans-serif;margin-left:6px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}.mut{color:var(--mut);font-size:14px}.r{text-align:right}
.seg{display:flex;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:3px;margin-bottom:12px}
.seg button{flex:1;border:0;background:none;color:var(--mut);padding:8px 4px;border-radius:9px;font:600 15px Mukta,sans-serif}.seg .on{background:var(--pri);color:var(--onp)}
.btn{width:100%;border:0;border-radius:12px;padding:12px;font:800 16px Mukta,sans-serif;background:var(--pri);color:var(--onp);margin-top:8px;display:block;text-align:center;text-decoration:none}
.btn.wa{background:#1fa855;color:#fff}.btn.g{background:none;color:var(--ink);border:1px solid var(--line)}
input,select{width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:400 16px Mukta,sans-serif;margin:4px 0}
.due{font-weight:800}.pos{color:var(--ok)}.neg{color:var(--bad)}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:center;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
nav div{display:flex;max-width:480px;width:100%}nav button{flex:1;border:0;background:none;color:var(--mut);font:600 12px Mukta,sans-serif;padding:4px 0}nav .on{color:var(--pri)}nav i{display:block;font-style:normal;font-size:20px}
.fab{position:fixed;right:max(16px,calc(50% - 224px));bottom:calc(76px + env(safe-area-inset-bottom,0px));border:0;border-radius:28px;padding:14px 20px;background:var(--acc);color:#1b232b;font:800 16px Mukta,sans-serif;box-shadow:0 4px 12px rgba(0,0,0,.25)}
.hz{height:12px;border-radius:10px 10px 0 0;background:repeating-linear-gradient(-45deg,var(--acc) 0 12px,#1b232b 12px 24px);margin:-12px -12px 10px}
.bill{border-top:0;border-radius:0 0 14px 14px;padding-top:12px}.it{display:grid;grid-template-columns:1fr auto;gap:2px 8px;padding:6px 0;border-bottom:1px dashed var(--line)}
.tot{font-size:22px;font-weight:800}.bars{display:flex;align-items:flex-end;gap:6px;height:130px;margin-top:8px}.bars div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;font-size:11px;color:var(--mut)}
.bars span{display:flex;align-items:flex-end;gap:2px;height:100%;width:100%}.bars em{flex:1;border-radius:4px 4px 0 0;min-height:2px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.ch{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}.ch button{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:20px;padding:6px 12px;font:600 14px Mukta,sans-serif}.ch .on{background:var(--acc);border-color:var(--acc);color:#1b232b}
.line{display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:4px}
</style></head><body><div id="app"></div>
<script>
const T={app:['SiteBook','साईटबुक'],wel:['Welcome back','स्वागत आहे'],first:['First time? Choose a username and password. They stay on this phone.','पहिल्यांदा? युजरनेम आणि पासवर्ड निवडा. ते याच फोनमध्ये राहतील.'],user:['Username','युजरनेम'],pass:['Password','पासवर्ड'],in:['Log in','लॉगिन'],out:['Log out','लॉगआउट'],bad:['Wrong username or password','युजरनेम किंवा पासवर्ड चुकीचा आहे'],
bills:['Bills','बिले'],parties:['Parties','पक्ष'],exp:['Expenses','खर्च'],rep:['Reports','अहवाल'],set:['Settings','सेटिंग्ज'],s:['Client bills','क्लायंट बिले'],p:['Material bills','साहित्य बिले'],c:['Clients','क्लायंट'],sp:['Suppliers','पुरवठादार'],
due:['Due','बाकी'],paid:['Paid','भरले'],rcv:['To receive','येणे'],pay:['To pay','देणे'],clr:['Cleared','चुकते'],new:['New bill','नवे बिल'],party:['Party','पक्ष'],item:['Work or material','काम किंवा साहित्य'],qty:['Qty','प्रमाण'],unit:['Unit','एकक'],rate:['Rate','दर'],add:['Add item','ओळ जोडा'],save:['Save','जतन करा'],total:['Total','एकूण'],rec:['Received','मिळाले'],
wa:['Share on WhatsApp','व्हॉट्सअ‍ॅपवर पाठवा'],cp:['Copy bill text','बिल कॉपी करा'],rp:['Record payment','रक्कम नोंदवा'],amt:['Amount','रक्कम'],back:['Back','मागे'],del:['Delete','काढून टाका'],name:['Name','नाव'],ph:['Phone','फोन'],pl:['Site or place','साईट / गाव'],np:['Add party','पक्ष जोडा'],kind:['Type','प्रकार'],
lab:['Labour','मजुरी'],mac:['Machinery','यंत्रे'],fuel:['Fuel','इंधन'],trn:['Transport','वाहतूक'],msc:['Site misc','साईट इतर'],note:['Note','टीप'],ae:['Add expense','खर्च जोडा'],d:['Daily','दैनिक'],w:['Weekly','साप्ताहिक'],m:['Monthly','मासिक'],
sales:['Billed to clients','क्लायंट बिले'],purch:['Material bought','साहित्य खरेदी'],net:['Net profit','निव्वळ नफा'],lang:['Language','भाषा'],theme:['Theme','थीम'],co:['Company name','कंपनीचे नाव'],none:['Nothing here yet','अजून काही नाही'],copied:['Copied','कॉपी केले']};
const $=s=>document.querySelector(s),E=x=>String(x??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fm=n=>'₹'+Math.round(n).toLocaleString('en-IN'),ds=o=>{let d=new Date();d.setDate(d.getDate()-o);return d.toLocaleDateString('en-CA')};
let S;try{S=JSON.parse(localStorage.getItem('sb'))}catch(x){}
if(!S)S={u:null,lang:'en',th:null,co:'Patil Constructions',n:10,
 P:[{id:1,n:'Shree Housing Society',k:'c',ph:'',pl:'Pune'},{id:2,n:'Ganesh Cement Depot',k:'s',ph:'',pl:'Jamkhed'},{id:3,n:'Sai Steel Traders',k:'s',ph:'',pl:'Ahilyanagar'},{id:4,n:'Deshmukh Farms',k:'c',ph:'',pl:'Karjat'}],
 B:[{id:5,t:'s',no:'S-1001',pid:1,d:ds(3),it:[{n:'RCC slab casting',q:450,u:'sqft',r:210},{n:'Brick masonry',q:8,u:'brass',r:9500}],paid:100000},{id:6,t:'p',no:'P-1001',pid:2,d:ds(2),it:[{n:'Cement bags',q:200,u:'bag',r:380}],paid:50000},{id:7,t:'p',no:'P-1002',pid:3,d:ds(9),it:[{n:'TMT steel',q:900,u:'kg',r:64}],paid:57600}],
 X:[{id:8,c:'lab',a:18500,d:ds(1),note:'Mason crew'},{id:9,c:'mac',a:6000,d:ds(4),note:'Mixer rent'},{id:10,c:'fuel',a:2400,d:ds(0),note:'Diesel'}]};
const sv=()=>{try{localStorage.setItem('sb',JSON.stringify(S))}catch(x){}};
let auth=false,tab='b',f='s',sub=null,per='w',ec='lab',msg='';
const t=k=>(T[k]||[k,k])[S.lang=='mr'?1:0],tot=b=>b.it.reduce((a,i)=>a+i.q*i.r,0),pt=id=>S.P.find(p=>p.id==id)||{n:'?',ph:''};
const fd=s=>new Date(s+'T00:00').toLocaleDateString(S.lang=='mr'?'mr-IN':'en-IN',{day:'numeric',month:'short'});
const nid=()=>++S.n,go=(a,b)=>{tab=a;sub=b||null;msg='';R()};
function setTh(){S.th=document.documentElement.dataset.theme=='dark'?'light':'dark';sv();R()}
function setLang(){S.lang=S.lang=='mr'?'en':'mr';sv();R()}
function login(){let u=$('#u').value.trim(),p=$('#p').value;if(!u||!p)return;if(!S.u){S.u={u,p};sv()}if(S.u.u==u&&S.u.p==p){auth=true;R()}else{msg=t('bad');R()}}
function seg(a,cur,fn){return'<div class="seg">'+a.map(k=>`<button class="${k==cur?'on':''}" onclick="${fn}('${k}')">${t(k)}</button>`).join('')+'</div>'}
function head(){return`<div class="top"><b>🧱 ${t('app')}</b><span><button class="ib" onclick="setLang()">${S.lang=='mr'?'EN':'मराठी'}</button><button class="ib" onclick="setTh()">🌓</button></span></div>`}
function outst(pid){return S.B.filter(b=>b.pid==pid).reduce((a,b)=>a+tot(b)-b.paid,0)}
function R(){document.documentElement.dataset.theme=S.th||'';document.documentElement.lang=S.lang;let h='',a=$('#app');
if(!auth){a.innerHTML=head()+`<div style="margin-top:12vh"><h2>${t('wel')}</h2><p class="mut">${S.u?'':t('first')}</p><input id="u" placeholder="${t('user')}" autocapitalize="none"><input id="p" type="password" placeholder="${t('pass')}"><p class="neg">${msg}</p><button class="btn" onclick="login()">${t('in')}</button></div>`;return}
if(sub&&sub.v=='bill')h=vBill(sub.id);else if(sub&&sub.v=='new')h=vNew();else h={b:vBills,p:vParties,x:vExp,r:vRep,t:vSet}[tab]();
a.innerHTML=head()+h+(sub?'':`<nav><div>${[['b','🧾','bills'],['p','👥','parties'],['x','💸','exp'],['r','📊','rep'],['t','⚙️','set']].map(n=>`<button class="${tab==n[0]?'on':''}" onclick="go('${n[0]}')"><i>${n[1]}</i>${t(n[2])}</button>`).join('')}</div></nav>`)}
function vBills(){let l=S.B.filter(b=>b.t==f).sort((a,b)=>b.id-a.id);return`<h2>${S.co}</h2>`+seg(['s','p'],f,'(k=>{f=k;R()})')+(l.map(b=>{let d=tot(b)-b.paid;return`<div class="card" onclick="go('b',{v:'bill',id:${b.id}})"><div class="row"><b>${E(pt(b.pid).n)}</b><b>${fm(tot(b))}</b></div><div class="row mut"><span>${b.no} · ${fd(b.d)}</span><span class="due ${d?'neg':'pos'}">${d?t('due')+' '+fm(d):t('paid')}</span></div></div>`}).join('')||`<p class="mut">${t('none')}</p>`)+`<button class="fab" onclick="go('b',{v:'new'})">＋ ${t('new')}</button>`}
function txt(b){let p=pt(b.pid);return`*${S.co}*\n${b.no} · ${fd(b.d)}\n${p.n}\n\n`+b.it.map(i=>`${i.n}: ${i.q} ${i.u} × ${i.r} = ${fm(i.q*i.r)}`).join('\n')+`\n\n*${t('total')}: ${fm(tot(b))}*\n${t('rec')}: ${fm(b.paid)}\n*${t('due')}: ${fm(tot(b)-b.paid)}*`}
function vBill(id){let b=S.B.find(x=>x.id==id),p=pt(b.pid),ph=(p.ph||'').replace(/\D/g,''),d=tot(b)-b.paid;if(ph.length==10)ph='91'+ph;
return`<button class="ib" style="margin:0 0 10px" onclick="go('b')">‹ ${t('back')}</button><div class="card bill"><div class="hz"></div><div class="row"><b>${b.t=='s'?t('s'):t('p')}</b><span class="mut">${b.no} · ${fd(b.d)}</span></div><h2 style="margin:8px 0">${E(p.n)}</h2>`+b.it.map(i=>`<div class="it"><b>${E(i.n)}</b><b class="r">${fm(i.q*i.r)}</b><span class="mut">${i.q} ${E(i.u)} × ${i.r}</span></div>`).join('')+`<div class="row" style="margin-top:10px"><span>${t('total')}</span><span class="tot">${fm(tot(b))}</span></div><div class="row mut"><span>${t('rec')}</span><span>${fm(b.paid)}</span></div><div class="row due ${d?'neg':'pos'}"><span>${t('due')}</span><span>${fm(d)}</span></div></div>
<a class="btn wa" target="_blank" rel="noopener" href="https://wa.me/${ph}?text=${encodeURIComponent(txt(b))}">💬 ${t('wa')}</a><button class="btn g" onclick="cp(${b.id})">${t('cp')}</button>
<div class="card" style="margin-top:12px"><b>${t('rp')}</b><input id="pa" type="number" inputmode="numeric" placeholder="${t('amt')}"><button class="btn" onclick="pay(${b.id})">${t('save')}</button></div><button class="btn g" onclick="delB(${b.id})">${t('del')}</button>`}
function cp(id){try{navigator.clipboard.writeText(txt(S.B.find(b=>b.id==id))).then(()=>alert(t('copied')))}catch(x){}}
function pay(id){let v=+$('#pa').value;if(v>0){S.B.find(b=>b.id==id).paid+=v;sv();R()}}
function delB(id){if(confirm(t('del')+'?')){S.B=S.B.filter(b=>b.id!=id);sv();go('b')}}
function vNew(){setTimeout(addRow,0);return`<h2>${t('new')}</h2>`+seg(['s','p'],f,'(k=>{f=k;R()})')+`<select id="np">${S.P.filter(p=>p.k==(f=='s'?'c':'s')).map(p=>`<option value="${p.id}">${E(p.n)}</option>`).join('')}</select><div id="rows"></div><button class="btn g" onclick="addRow()">＋ ${t('add')}</button><div class="row" style="margin:12px 0"><span>${t('total')}</span><span class="tot" id="tt">₹0</span></div><input id="npd" type="number" inputmode="numeric" placeholder="${t('rec')}"><button class="btn" onclick="saveB()">${t('save')}</button><button class="btn g" onclick="go('b')">${t('back')}</button>`}
function addRow(){let r=document.createElement('div');r.className='card';r.innerHTML=`<input class="n" placeholder="${t('item')}"><div class="line" style="grid-template-columns:1fr 1fr 1fr"><input class="q" type="number" inputmode="decimal" placeholder="${t('qty')}" oninput="calc()"><input class="u" placeholder="${t('unit')}" value="nos"><input class="r" type="number" inputmode="decimal" placeholder="${t('rate')}" oninput="calc()"></div>`;$('#rows')&&$('#rows').appendChild(r)}
function rows(){return[...document.querySelectorAll('#rows .card')].map(r=>({n:r.querySelector('.n').value.trim(),q:+r.querySelector('.q').value,u:r.querySelector('.u').value.trim(),r:+r.querySelector('.r').value})).filter(i=>i.n&&i.q&&i.r)}
function calc(){$('#tt').textContent=fm(rows().reduce((a,i)=>a+i.q*i.r,0))}
function saveB(){let it=rows(),pid=+$('#np').value;if(!it.length||!pid)return;let c=S.B.filter(b=>b.t==f).length+1001;S.B.push({id:nid(),t:f,no:(f=='s'?'S-':'P-')+c,pid,d:ds(0),it,paid:+$('#npd').value||0});sv();go('b')}
function vParties(){let g=(k,ti)=>`<h2>${t(ti)}</h2>`+(S.P.filter(p=>p.k==k).map(p=>{let o=outst(p.id);return`<div class="card row"><div><b>${E(p.n)}</b><div class="mut">${E(p.pl)}${p.ph?' · '+E(p.ph):''}</div></div><div class="r due ${o?'neg':'pos'}">${o?fm(o):t('clr')}<div class="mut" style="font-weight:400">${o?(k=='c'?t('rcv'):t('pay')):''}</div></div></div>`}).join('')||`<p class="mut">${t('none')}</p>`);
return g('c','c')+g('s','sp')+`<div class="card" style="margin-top:14px"><b>${t('np')}</b><select id="pk"><option value="c">${t('c')}</option><option value="s">${t('sp')}</option></select><input id="pn" placeholder="${t('name')}"><input id="pp" type="tel" placeholder="${t('ph')}"><input id="pl" placeholder="${t('pl')}"><button class="btn" onclick="addP()">${t('save')}</button></div>`}
function addP(){let n=$('#pn').value.trim();if(!n)return;S.P.push({id:nid(),n,k:$('#pk').value,ph:$('#pp').value.trim(),pl:$('#pl').value.trim()});sv();R()}
function vExp(){let C=['lab','mac','fuel','trn','msc'],tt=S.X.reduce((a,x)=>a+x.a,0);return`<h2>${t('exp')}</h2><div class="card"><div class="ch">${C.map(c=>`<button class="${c==ec?'on':''}" onclick="ec='${c}';R()">${t(c)}</button>`).join('')}</div><input id="xa" type="number" inputmode="numeric" placeholder="${t('amt')}"><input id="xn" placeholder="${t('note')}"><button class="btn" onclick="addX()">${t('ae')}</button></div><div class="card row"><span>${t('total')}</span><b class="tot neg">${fm(tt)}</b></div>`+S.X.slice().sort((a,b)=>b.id-a.id).map(x=>`<div class="card row"><div><b>${t(x.c)}</b><div class="mut">${fd(x.d)} · ${E(x.note)}</div></div><b class="neg">− ${fm(x.a)}</b></div>`).join('')}
function addX(){let a=+$('#xa').value;if(a>0){S.X.push({id:nid(),c:ec,a,d:ds(0),note:$('#xn').value.trim()});sv();R()}}
function vRep(){let N=per=='m'?6:per=='w'?6:7,B=[...Array(N)].map(()=>({s:0,p:0,x:0})),T0=new Date(ds(0)+'T00:00');
let ix=d=>{let D=new Date(d+'T00:00'),da=Math.round((T0-D)/864e5),i;if(per=='d')i=N-1-da;else if(per=='w')i=N-1-Math.floor(da/7);else i=N-1-((T0.getFullYear()*12+T0.getMonth())-(D.getFullYear()*12+D.getMonth()));return i>=0&&i<N&&da>=0?i:-1};
S.B.forEach(b=>{let i=ix(b.d);if(i>=0)B[i][b.t]+=tot(b)});S.X.forEach(x=>{let i=ix(x.d);if(i>=0)B[i].x+=x.a});
let s=B.reduce((a,b)=>a+b.s,0),p=B.reduce((a,b)=>a+b.p,0),x=B.reduce((a,b)=>a+b.x,0),mx=Math.max(1,...B.map(b=>Math.max(b.s,b.p))),n=s-p-x;
let lb=i=>per=='d'?new Date(T0-(N-1-i)*864e5).getDate():per=='w'?(i==N-1?'●':'-'+(N-1-i)+'w'):new Date(T0.getFullYear(),T0.getMonth()-(N-1-i),1).toLocaleDateString(S.lang=='mr'?'mr-IN':'en-IN',{month:'short'});
return`<h2>${t('rep')}</h2>`+seg(['d','w','m'],per,'(k=>{per=k;R()})')+`<div class="grid2"><div class="card"><div class="mut">${t('sales')}</div><b class="tot">${fm(s)}</b></div><div class="card"><div class="mut">${t('purch')}</div><b class="tot">${fm(p)}</b></div><div class="card"><div class="mut">${t('exp')}</div><b class="tot">${fm(x)}</b></div><div class="card"><div class="mut">${t('net')}</div><b class="tot ${n<0?'neg':'pos'}">${fm(n)}</b></div></div><div class="card"><div class="row mut"><span>■ <span style="color:var(--pri)">${t('sales')}</span></span><span style="color:var(--acc)">■ ${t('purch')}</span></div><div class="bars">${B.map((b,i)=>`<div><span><em style="height:${b.s/mx*100}%;background:var(--pri)"></em><em style="height:${b.p/mx*100}%;background:var(--acc)"></em></span>${lb(i)}</div>`).join('')}</div></div>`}
function vSet(){return`<h2>${t('set')}</h2><div class="card"><b>${t('co')}</b><input value="${E(S.co)}" onchange="S.co=this.value;sv()"></div><div class="card"><b>${t('lang')}</b><div class="seg" style="margin:8px 0 0"><button class="${S.lang=='en'?'on':''}" onclick="S.lang='en';sv();R()">English</button><button class="${S.lang=='mr'?'on':''}" onclick="S.lang='mr';sv();R()">मराठी</button></div></div><button class="btn g" onclick="setTh()">🌓 ${t('theme')}</button><button class="btn" onclick="auth=false;R()">${t('out')}</button>`}
R();
</script></body></html>
